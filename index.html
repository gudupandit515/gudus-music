<style>
:root{--bg:#0d0e22;--s:#171a38;--ink:#eef0ff;--mu:#9ba1cf;--ln:#2a2e5c;--ac:#f2b53a;color-scheme:dark}
*{box-sizing:border-box}
body{--c1:#e8a317;--c2:#7a4cff;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
button,input{font:inherit;color:inherit}

.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(100px);opacity:.3;transition:background-color 1.4s;animation:fl 20s ease-in-out infinite alternate}
.bg i:first-child{background:var(--c1);top:-20vmax;left:-15vmax}
.bg i:last-child{background:var(--c2);bottom:-25vmax;right:-15vmax;animation-delay:-9s}

header{position:sticky;top:0;z-index:20;height:72px;padding:0 18px;display:flex;align-items:center;backdrop-filter:blur(14px);background:rgba(13,14,34,.6)}

.seg button.on{color:#1b1d3a}

#brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:left center;margin:0;font-size:1.55rem;white-space:nowrap;letter-spacing:-.02em;transition:left .75s cubic-bezier(.2,.8,.2,1),transform .75s cubic-bezier(.2,.8,.2,1),opacity .5s;pointer-events:none}
.sr{position:absolute;right:18px;top:14px;height:44px;width:44px;border-radius:22px;background:rgba(255,255,255,.1);display:flex;align-items:center;transition:width .7s cubic-bezier(.2,.8,.2,1),background .3s}

.sr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

#sug li button:hover{background:rgba(255,255,255,.08)}
.app{max-width:1240px;margin:0 auto;padding:6px 18px 40px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.chip{flex:none;background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;transition:background .3s,color .3s,transform .2s}

.chip.on{background:var(--ac);color:#1b1d3a}
.layout{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}

 footer{display:none}

.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.2s}.eq i:nth-child(5){animation-delay:-.8s}.eq i:nth-child(6){animation-delay:-.45s}.eq i:nth-child(7){animation-delay:-.1s}

.kr{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.status{min-height:1.4em;color:var(--mu);font-size:.9rem;margin:0 0 10px}
footer{text-align:center;color:var(--mu);font-size:.82rem;margin-top:30px}
footer button{background:none;border:0;color:var(--ac);cursor:pointer;text-decoration:underline}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

function api(path){

    return r.json().then(function(j){if(j.error)throw new Error(j.error.message);return j})});

  var k="j|"+p+"|"+(lim||20),c=cget(k);if(c)return Promise.resolve(c);
  return fetch("https://api.jamendo.com/v3.0/tracks/?client_id="+encodeURIComponent(getKey())+"&format=json&limit="+(lim||20)+"&imagesize=400&audiodlformat=mp32&"+p).then(function(r){return r.json()}).then(function(j){
